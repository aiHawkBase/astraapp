<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astra | Kozmik Yönetim</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #e2e8f0;
            --accent: #8b5cf6;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --gold: #f1c40f;
        }

        body {
            background-color: var(--bg-dark);
            background-image:
                radial-gradient(circle at 10% 20%, rgba(139, 92, 246, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.1) 0%, transparent 20%);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            min-height: 100vh;
        }

        .admin-header {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            color: var(--gold);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .admin-container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .grid-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.5rem;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
        }

        .stat-title {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            font-family: 'Cinzel', serif;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
        }

        h2 {
            margin: 0;
            font-family: 'Cinzel', serif;
            color: var(--gold);
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
        }

        th {
            text-align: left;
            padding: 12px;
            color: #94a3b8;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        td {
            padding: 16px 12px;
            background: rgba(255, 255, 255, 0.03);
        }

        tr td:first-child {
            border-top-left-radius: 8px;
            border-bottom-left-radius: 8px;
        }

        tr td:last-child {
            border-top-right-radius: 8px;
            border-bottom-right-radius: 8px;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.06);
        }

        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-pending {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
            border: 1px solid var(--warning);
        }

        .status-processing {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border: 1px solid #60a5fa;
        }

        .status-completed {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .status-failed {
            background: rgba(239, 68, 68, 0.2);
            color: var(--error);
            border: 1px solid var(--error);
        }

        input,
        select {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 10px;
            border-radius: 8px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: var(--accent);
        }

        .btn-action {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-action:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        .btn-icon {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #94a3b8;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        /* Login Overlay */
        #login-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .login-box {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            padding: 2rem;
            border-radius: 20px;
            text-align: center;
            width: 320px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body>

    <div id="login-overlay">
        <div class="login-box">
            <h2 style="margin-bottom: 20px; color: var(--gold); font-family: 'Cinzel', serif;">Kozmik Giriş</h2>
            <input type="password" id="admin-pass" placeholder="Şifre" style="width: 100%; margin-bottom: 15px;">
            <button class="btn-action" style="width: 100%;" onclick="checkAuth()">Bağlan</button>
        </div>
    </div>

    <header class="admin-header">
        <div class="brand">
            <i class="fa-solid fa-infinity"></i> ASTRA OS
        </div>
        <div style="display: flex; gap: 15px; align-items: center;">
            <span id="server-status" style="font-size: 0.9rem; color: var(--success);">
                <i class="fa-solid fa-circle" style="font-size: 0.6rem;"></i> SISTEM AKTIF
            </span>
            <button class="btn-action" onclick="window.location.href='/kutsal-icerik-yonetimi'">
                <i class="fa-solid fa-database"></i> İçerik Yönetimi
            </button>
        </div>
    </header>

    <div class="admin-container">

        <!-- Stats -->
        <div class="grid-stats">
            <div class="stat-card">
                <div class="stat-title">Toplam Analiz</div>
                <div class="stat-value" id="stat-total" style="color: var(--accent);">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">İşlenen (Aktif)</div>
                <div class="stat-value" id="stat-processing" style="color: #60a5fa;">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Hatalı</div>
                <div class="stat-value" id="stat-failed" style="color: var(--error);">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Gelir (Tahmini)</div>
                <div class="stat-value" style="color: var(--success);">₺<span id="stat-revenue">0</span></div>
            </div>
        </div>

        <!-- Settings -->
        <div class="card">
            <div class="card-header">
                <h2><i class="fa-solid fa-sliders"></i> Sistem Ayarları</h2>
                <button class="btn-action" onclick="saveSettings()">Kaydet</button>
            </div>
            <div style="display: flex; gap: 20px; flex-wrap: wrap;">
                <div>
                    <label style="display: block; margin-bottom: 5px; color: #94a3b8;">AI Model</label>
                    <select id="config-model">
                        <option value="gemini-3-flash-preview">Gemini 3 Flash (Preview)</option>
                        <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
                        <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
                    </select>
                </div>
                <div>
                    <label style="display: block; margin-bottom: 5px; color: #94a3b8;">Analiz Fiyatı</label>
                    <input type="number" id="config-price" value="299" style="width: 100px;">
                </div>
            </div>
        </div>

        <!-- Jobs -->
        <div class="card">
            <div class="card-header">
                <h2><i class="fa-solid fa-list-ul"></i> Son İşlemler</h2>
                <button class="btn-icon" onclick="loadJobs()"><i class="fa-solid fa-sync"></i></button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Zaman</th>
                        <th>Kullanıcı</th>
                        <th>Detay</th>
                        <th>Maliyet</th>
                        <th>Durum</th>
                        <th>Aksiyon</th>
                    </tr>
                </thead>
                <tbody id="jobs-body"></tbody>
            </table>
        </div>

    </div>

    <script>
        const API_BASE = '/api';

        function checkAuth() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === 'admin123') {
                document.getElementById('login-overlay').style.display = 'none';
                loadData();
            } else { alert('Erişim Reddedildi'); }
        }

        async function loadData() {
            await Promise.all([loadStats(), loadJobs()]);
        }

        async function loadStats() {
            try {
                const res = await fetch(`${API_BASE}/admin/stats`);
                const data = await res.json();
                document.getElementById('stat-total').innerText = data.total;
                document.getElementById('stat-processing').innerText = data.processing;
                document.getElementById('stat-failed').innerText = data.failed;
                document.getElementById('stat-revenue').innerText = (data.total * 299).toLocaleString();
            } catch (e) { console.error(e); }
        }

        async function loadJobs() {
            const res = await fetch(`${API_BASE}/admin/jobs`);
            const jobs = await res.json();
            const tbody = document.getElementById('jobs-body');
            tbody.innerHTML = '';

            jobs.forEach(job => {
                const tr = document.createElement('tr');
                const date = new Date(job.created_at).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
                const cost = job.api_cost ? '₺' + parseFloat(job.api_cost).toFixed(2) : '-';

                tr.innerHTML = `
                    <td style="font-family: monospace; color: #64748b;">#${job.id}</td>
                    <td>${date}</td>
                    <td>${job.user_email || 'Anonim'}</td>
                    <td style="color: #cbd5e1;">${job.prompt ? job.prompt.substring(0, 30) : '-'}...</td>
                    <td style="color: #f7b731;">${cost}</td>
                    <td><span class="status-badge status-${job.status}">${job.status}</span></td>
                    <td>
                        ${job.status === 'completed' ? `<button class="btn-icon" onclick="viewReport(${job.id})" title="Görüntüle"><i class="fa-solid fa-eye"></i></button>` : ''}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function viewReport(id) {
            const win = window.open('', '_blank');
            win.document.write('<style>body{background:#0a0a0a;color:white;display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif;}</style><h1>Yükleniyor...</h1>');

            try {
                const res = await fetch(`${API_BASE}/jobs/${id}`);
                const data = await res.json();

                if (!data.data) { win.close(); alert('Veri yok'); return; }

                const content = data.data;
                const images = content.images || {};

                // Construct HTML matching app.js renderFullReport
                let html = `
                <html><head>
                    <title>Rapor #${id}</title>
                    <link rel="stylesheet" href="style.css">
                    <link rel="preconnect" href="https://fonts.googleapis.com">
                    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
                    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
                </head>
                <body class="report-view-body">
                    <div class="container" style="max-width: 1000px; margin: 40px auto; color: #333;">
                        <div id="report-content" class="booklet-mode">
                `;

                // Header
                html += `
                    <div class="booklet-header">
                        <h1>${content.booklet_title || 'Kozmik Rapor'}</h1>
                        <p>ID: #${id} | ${new Date().toLocaleDateString()}</p>
                    </div>`;

                // Birth Chart Image
                if (images.birth_chart) html += `<div class="birth-chart-container"><img src="${images.birth_chart}" class="booklet-image"></div>`;

                // Intro
                if (content.intro) html += `<div class="booklet-chapter"><h2>${content.intro.title}</h2><div class="chapter-content"><p>${content.intro.content}</p></div></div>`;

                // Chapters
                if (content.chapters) {
                    content.chapters.forEach((chap, i) => {
                        html += `<div class="booklet-chapter"><h2>${chap.title}</h2><div class="chapter-content"><p>${chap.content ? chap.content.replace(/\\n/g, '<br>') : ''}</p></div>`;
                        // Images
                        if (i === 2 && images.love) html += `<img src="${images.love}" class="booklet-image">`;
                        if (i === 4 && images.career) html += `<img src="${images.career}" class="booklet-image">`;
                        html += `</div>`;
                    });
                }

                // Astrocartography
                if (content.astrocartography) {
                    html += `<div class="booklet-chapter"><h2>${content.astrocartography.title}</h2><div class="locations-grid">`;
                    content.astrocartography.locations.forEach(loc => {
                        html += `<div class="location-card"><h4>${loc.city}</h4><p><strong>${loc.purpose}</strong></p><p>${loc.desc}</p></div>`;
                    });
                    html += `</div></div>`;
                }

                html += `</div></div></body></html>`;

                win.document.open();
                win.document.write(html);
                win.document.close();

            } catch (e) {
                win.document.body.innerHTML = "Hata: " + e.message;
            }
        }

        async function saveSettings() {
            const model = document.getElementById('config-model').value;
            const price = document.getElementById('config-price').value;

            try {
                await fetch(`${API_BASE}/admin/config`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key: 'model_name', value: model })
                });
                await fetch(`${API_BASE}/admin/config`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key: 'price_standard', value: price })
                });
                alert('Ayarlar kaydedildi.');
            } catch (e) { console.error(e); alert('Hata'); }
        }
    </script>
</body>

</html>
